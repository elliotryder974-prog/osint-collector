<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public OSINT Search</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: #e8edf7;
      font-family: Inter, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      display: inline-flex;
      width: 55px;
      height: 55px;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #171d2b;
      border: 1px solid #293247;
      font-size: 25px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #8994a8;
      font-size: 15px;
    }

    .search-panel {
      background: #0f141e;
      border: 1px solid #20293a;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field label {
      display: block;
      color: #b9c2d2;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      border: 1px solid #293449;
      background: #090d15;
      color: white;
      padding: 0 14px;
      outline: none;
      font-size: 14px;
    }

    input:focus, select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, .12);
    }

    .username-row {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 8px;
    }

    .search-button {
      width: 100%;
      margin-top: 22px;
      height: 50px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    .search-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .search-button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .results {
      display: none;
      margin-top: 25px;
    }

    .results.visible {
      display: block;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .results-header h2 {
      font-size: 18px;
    }

    .status {
      color: #63d297;
      font-size: 12px;
    }

    .result-card {
      background: #0f141e;
      border: 1px solid #20293a;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .result-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .result-title strong {
      font-size: 15px;
    }

    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 20px;
      background: #172338;
      color: #8eb3ff;
    }

    .info {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 9px;
      font-size: 13px;
    }

    .info .key {
      color: #78859b;
    }

    .info .value {
      color: #dce3ef;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      color: #78859b;
      padding: 35px;
      border: 1px dashed #293449;
      border-radius: 12px;
    }

    .notice {
      margin-top: 15px;
      color: #69768c;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 700px) {
      .inputs {
        grid-template-columns: 1fr;
      }

      .username-row {
        grid-template-columns: 1fr;
      }

      .info {
        grid-template-columns: 1fr;
        gap: 3px;
      }

      .info .key {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">⌕</div>
    <h1>Public OSINT Search</h1>
    <p class="subtitle">
      Search publicly available information using a phone number or username.
    </p>
  </header>

  <section class="search-panel">

    <div class="inputs">

      <!-- Phone number -->
      <div class="field">
        <label for="phone">Phone number</label>
        <input
          id="phone"
          type="tel"
          placeholder="+1 555 123 4567"
        >
      </div>

      <!-- Username + platform -->
      <div class="field">
        <label for="username">Username + platform</label>

        <div class="username-row">
          <input
            id="username"
            type="text"
            placeholder="username"
          >

          <select id="platform">
            <option value="twitter">X / Twitter</option>
            <option value="instagram">Instagram</option>
            <option value="github">GitHub</option>
            <option value="reddit">Reddit</option>
            <option value="tiktok">TikTok</option>
            <option value="youtube">YouTube</option>
          </select>
        </div>
      </div>

    </div>

    <button class="search-button" id="searchButton">
      Search Public Information
    </button>

    <p class="notice">
      Only publicly accessible information should be collected.
      Do not use this tool to access private accounts, passwords,
      leaked credentials, or other non-public data.
    </p>

  </section>


  <!-- Results -->
  <section class="results" id="results">

    <div class="results-header">
      <h2>Search Results</h2>
      <span class="status" id="status">Complete</span>
    </div>

    <div id="resultsContainer"></div>

  </section>

</div>


<script>

  const searchButton = document.getElementById("searchButton");
  const results = document.getElementById("results");
  const resultsContainer = document.getElementById("resultsContainer");
  const status = document.getElementById("status");

  searchButton.addEventListener("click", async () => {

    const phone = document.getElementById("phone").value.trim();
    const username = document.getElementById("username").value.trim();
    const platform = document.getElementById("platform").value;

    if (!phone && !username) {
      alert("Enter a phone number or username.");
      return;
    }

    searchButton.disabled = true;
    searchButton.textContent = "Searching...";

    results.classList.add("visible");
    status.textContent = "Searching...";

    resultsContainer.innerHTML = `
      <div class="empty">
        Searching publicly available sources...
      </div>
    `;

    /*
      Replace this section with a request to YOUR backend.

      Example:

      const response = await fetch("/api/search", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          phone,
          username,
          platform
        })
      });

      const data = await response.json();

      renderResults(data);
    */

    // Demo result
    await new Promise(resolve => setTimeout(resolve, 1200));

    const searchType = phone
      ? "Phone number"
      : "Username";

    const searchValue = phone || username;

    resultsContainer.innerHTML = `
      <div class="result-card">

        <div class="result-title">
          <strong>Search submitted</strong>
          <span class="badge">${searchType}</span>
        </div>

        <div class="info">
          <div class="key">Identifier</div>
          <div class="value">${escapeHTML(searchValue)}</div>

          ${
            username
              ? `
                <div class="key">Platform</div>
                <div class="value">${escapeHTML(platform)}</div>
              `
              : ""
          }

          <div class="key">Data source</div>
          <div class="value">Public sources only</div>

          <div class="key">Status</div>
          <div class="value">
            Connect a backend/API to perform real public-source searches.
          </div>
        </div>

      </div>
    `;

    status.textContent = "Complete";

    searchButton.disabled = false;
    searchButton.textContent = "Search Public Information";

  });


  function escapeHTML(value) {
    return value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

</script>

</body>
</html>
